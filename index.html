<script>// ===== Caravan Engineer — pure logic (generator, physics model, solver) =====
var CL=(function(){
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// piece types: cells (x right, y up), weight, fragile
var TYPES={
 crate:{c:[[0,0]],w:2},
 sack:{c:[[0,0]],w:3},
 rug:{c:[[0,0],[1,0]],w:2},
 jar:{c:[[0,0],[0,1]],w:2,fr:1},
 bale:{c:[[0,0],[1,0],[2,0]],w:3},
 spice:{c:[[0,0],[1,0],[0,1]],w:4},
 chest:{c:[[0,0],[1,0],[0,1],[1,1]],w:6},
 tea:{c:[[0,0],[0,1],[1,1]],w:3,fr:1}
};
var FRAG=2.5,SADDLE=0.6,TOLK=0.30;
function norm(c){var mx=1e9,my=1e9;c.forEach(function(p){mx=Math.min(mx,p[0]);my=Math.min(my,p[1]);});return c.map(function(p){return[p[0]-mx,p[1]-my];}).sort(function(a,b){return a[0]-b[0]||a[1]-b[1];});}
function rot(c,r){var o=c;for(var i=0;i<r;i++)o=o.map(function(p){return[p[1],-p[0]];});return norm(o);}
function cellsOf(t,r){return rot(TYPES[t].c,r%4);}
function nRots(t){var s={},n=0;for(var r=0;r<4;r++){var k=JSON.stringify(cellsOf(t,r));if(!s[k]){s[k]=1;n++;}}return n;}
function uniqRots(t){var s={},o=[];for(var r=0;r<4;r++){var k=JSON.stringify(cellsOf(t,r));if(!s[k]){s[k]=1;o.push(r);}}return o;}
// camel load = list of placed {t,r,x,y,id}
function heights(load,W){var h=[];for(var i=0;i<W;i++)h.push(0);load.forEach(function(p){cellsOf(p.t,p.r).forEach(function(c){var x=p.x+c[0],y=p.y+c[1]+1;if(y>h[x])h[x]=y;});});return h;}
function dropY(load,W,H,t,r,x){var c=cellsOf(t,r),h=heights(load,W),y=0;for(var i=0;i<c.length;i++){var cx=x+c[i][0];if(cx<0||cx>=W)return -1;y=Math.max(y,h[cx]-c[i][1]);}
 for(i=0;i<c.length;i++)if(y+c[i][1]>=H)return -1;return y;}
function stats(load,W){var tw=0,sx=0,sy=0;load.forEach(function(p){var c=cellsOf(p.t,p.r),cw=TYPES[p.t].w/c.length;c.forEach(function(q){tw+=cw;sx+=cw*(p.x+q[0]+.5-W/2);sy+=cw*(p.y+q[1]+.5);});});
 return{w:tw,cx:tw?sx/tw:0,cy:tw?sy/tw+SADDLE:SADDLE};}
function fragileOK(load){for(var i=0;i<load.length;i++){var p=load[i];if(!TYPES[p.t].fr)continue;var c=cellsOf(p.t,p.r),top={};c.forEach(function(q){var x=p.x+q[0],y=p.y+q[1];if(top[x]===undefined||y>top[x])top[x]=y;});
  var above=0;load.forEach(function(o,j){if(j===i)return;var oc=cellsOf(o.t,o.r),cw=TYPES[o.t].w/oc.length;oc.forEach(function(q){var x=o.x+q[0],y=o.y+q[1];if(top[x]!==undefined&&y>top[x])above+=cw;});});
  if(above>FRAG+1e-9)return false;}return true;}
function tolOf(lv,cam,mods){mods=mods||{};return lv.W/2*TOLK*(1+.06*(mods.steady||0))+(cam.rope?.35*(1+.25*(mods.rope||0)):0);}
function capOf(lv,mods){return lv.cap+2*((mods&&mods.saddle)||0);}
// margin at worst tilt (negative = falls)
function margin(lv,cam,mods,th){var s=stats(cam.load,lv.W),tol=tolOf(lv,cam,mods);
 if(th!==undefined)return tol-Math.abs(s.cx+s.cy*Math.tan(th));
 return tol-Math.max(Math.abs(s.cx+s.cy*Math.tan(lv.tmax)),Math.abs(s.cx+s.cy*Math.tan(lv.tmin)));}
function camelOK(lv,cam,mods){var s=stats(cam.load,lv.W);return s.w<=capOf(lv,mods)+1e-9&&fragileOK(cam.load)&&margin(lv,cam,mods)>=-1e-9;}
// ---- route ----
function makeRoute(R,len,tmax,gust,bump){var hills=[],x=8,big=false;
 while(x<len-10){var L=10+R()*10,th=tmax*(.55+R()*.45);if(!big&&x>len*.4){th=tmax;big=true;}hills.push({x:x,L:L,a:Math.tan(th)*L/Math.PI});x+=L+2+R()*4;}
 if(!big&&hills.length)hills[hills.length-1].a=Math.tan(tmax)*hills[hills.length-1].L/Math.PI;
 var bumps=[];if(bump)for(var b=0;b<bump;b++){var bx=6+R()*(len-14);bumps.push({x:bx,L:2.4,a:Math.tan(tmax*.7)*2.4/Math.PI*.5});}
 var gz=[];if(gust>0){var n=1+Math.floor(R()*2);for(var g=0;g<n;g++)gz.push({x:12+R()*(len-26),L:7,g:gust*(R()<.5?1:-1)});}
 return{len:len,hills:hills,bumps:bumps,gusts:gz};}
function hAt(rt,x){var h=0;rt.hills.concat(rt.bumps).forEach(function(k){if(x>k.x&&x<k.x+k.L)h+=k.a*(1-Math.cos(2*Math.PI*(x-k.x)/k.L))/2;});return h;}
function gustAt(rt,x){var g=0;rt.gusts.forEach(function(z){if(x>z.x&&x<z.x+z.L)g+=z.g*Math.sin(Math.PI*(x-z.x)/z.L);});return g;}
function thAt(rt,x){var e=.05;return Math.atan((hAt(rt,x+e)-hAt(rt,x-e))/(2*e))+gustAt(rt,x);}
function extremes(rt){var mn=0,mx=0;for(var x=0;x<=rt.len;x+=.05){var t=thAt(rt,x);if(t<mn)mn=t;if(t>mx)mx=t;}return[mn,mx];}
// ---- solver: DFS over remaining pieces ----
function solve(lv,cams,rem,mods,limit){var nodes=0,cs=cams.map(function(c){return{load:c.load.slice(),rope:c.rope};}),path=[];
 rem=rem.slice().sort(function(a,b){return TYPES[b.t].w*10+TYPES[b.t].c.length-(TYPES[a.t].w*10+TYPES[a.t].c.length);});
 var cap=capOf(lv,mods);
 function rec(i){if(++nodes>limit)return false;if(i===rem.length){for(var k=0;k<cs.length;k++)if(!camelOK(lv,cs[k],mods))return false;return true;}
  var p=rem[i],cand=[];
  for(var k=0;k<cs.length;k++){var st=stats(cs[k].load,lv.W);if(st.w+TYPES[p.t].w>cap+1e-9)continue;
   uniqRots(p.t).forEach(function(r){for(var x=0;x<lv.W;x++){var y=dropY(cs[k].load,lv.W,lv.H,p.t,r,x);if(y<0)continue;
    var pl={t:p.t,r:r,x:x,y:y,id:p.id};cs[k].load.push(pl);var ok=fragileOK(cs[k].load),s2=stats(cs[k].load,lv.W);cs[k].load.pop();if(!ok)continue;
    cand.push({k:k,pl:pl,sc:Math.abs(s2.cx)*2+s2.cy+s2.w*.15*(1+ (k%2)*.01)+Math.random()*.01});}});}
  cand.sort(function(a,b){return a.sc-b.sc;});
  for(var j=0;j<cand.length;j++){var c=cand[j];cs[c.k].load.push(c.pl);path.push({k:c.k,pl:c.pl});if(rec(i+1))return true;cs[c.k].load.pop();path.pop();}
  return false;}
 var ok=rec(0);return ok?path:null;}
// ---- level generator ----
function level(n,seed){var R=rng(seed||(n*7919+13));
 for(var attempt=0;attempt<60;attempt++){
 var camels=n<4?1:n<11?2:3,W=n<3?3:n<8?4:5,H=n<14?4:5,len=Math.min(150,50+n*4);
 var tdeg=Math.min(19,8+n*.8+R()*2),gust=n>=5?Math.min(5,(n-4)*.5+R()*1.5):0;
 var pool=['crate','crate','sack','rug','bale'];if(n>=2)pool.push('spice');if(n>=4)pool.push('chest');if(n>=6)pool.push('jar','jar');if(n>=9)pool.push('tea');
 var cap=W*H*camels,target=Math.min(.5,.32+n*.01)*cap-attempt*.25,cells=0,pcs=[],id=0;
 while(cells<target){var t=pool[Math.floor(R()*pool.length)];pcs.push({t:t,id:id++});cells+=TYPES[t].c.length;}
 var rt=makeRoute(R,len,tdeg*Math.PI/180,gust*Math.PI/180,n>=3?Math.min(4,Math.floor(n/3)):0),ex=extremes(rt);
 var tot=0;pcs.forEach(function(p){tot+=TYPES[p.t].w;});
 var lv={n:n,camels:camels,W:W,H:H,cap:Math.ceil(tot/camels*1.25)+1,tmin:ex[0],tmax:ex[1],route:rt,pieces:pcs,ropes:n>=3?1+Math.floor(n/8):0};
 var cams=[];for(var k=0;k<camels;k++)cams.push({load:[],rope:0});
 var sol=solve(lv,cams,pcs,{},1500);
 if(sol){var mxw=0;for(k=0;k<camels;k++){var w=0;sol.forEach(function(s){if(s.k===k)w+=TYPES[s.pl.t].w;});mxw=Math.max(mxw,w);}lv.cap=Math.max(mxw,Math.ceil(tot/camels))+(n<6?2:1);lv.sol=sol;
  // shuffle tray order
  for(var i=pcs.length-1;i>0;i--){var j=Math.floor(R()*(i+1)),tmp=pcs[i];pcs[i]=pcs[j];pcs[j]=tmp;}return lv;}
 }return null;}
return{TYPES:TYPES,rng:rng,cellsOf:cellsOf,uniqRots:uniqRots,heights:heights,dropY:dropY,stats:stats,fragileOK:fragileOK,tolOf:tolOf,capOf:capOf,margin:margin,camelOK:camelOK,hAt:hAt,gustAt:gustAt,thAt:thAt,solve:solve,level:level,FRAG:FRAG};
})();
if(typeof module!=='undefined')module.exports=CL;
